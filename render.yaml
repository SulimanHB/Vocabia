services:
  - type: web
    name: vocabia-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:demo
    startCommand: npm run start:demo
    # No crea sesiones: sirve de health check sin ocupar plazas de la demo.
    healthCheckPath: /api/demo-info
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Cada sesión ocupa ~200 MB y el plan gratuito tiene 512 MB.
      - key: DEMO_MAX_SESSIONS
        value: "1"
